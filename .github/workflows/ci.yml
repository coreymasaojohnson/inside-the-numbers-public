# Continuous integration for inside-the-numbers-public.
#
# Every gate below is enforced. Nothing is skipped to make the badge green —
# if a check fails here, it is because the repository does not pass it.
#
# This is a pnpm project: there is no package-lock.json, so npm ci cannot be
# used. The pnpm version is pinned below because pnpm 12 renamed the
# build-approval key (onlyBuiltDependencies -> allowBuilds) and a mismatch
# makes `pnpm install --frozen-lockfile` exit non-zero. Keep `version` here in
# step with your local `pnpm --version`, or add a "packageManager" field to
# package.json and delete the `version` line, which lets the action read it.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    name: Web app — types, lint, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm run check

      - name: Formatting
        run: pnpm exec prettier --check .

      - name: Lint
        run: pnpm exec eslint .

      - name: Build
        run: pnpm run build

  pipeline:
    name: IPUMS pipeline — tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install
        run: pip install pytest pandas lxml

      - name: Test
        run: python -m pytest -v

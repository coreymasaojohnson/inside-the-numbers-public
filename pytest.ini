# Without this, `pytest scripts/` fails with ModuleNotFoundError: No module
# named 'scripts'. Plain pytest does not put the working directory on
# sys.path, so `import scripts.ipums_to_json_v2` in the test module cannot
# resolve; only `python -m pytest` happens to work. Setting pythonpath makes
# both spellings work, which matters because a reviewer will type `pytest`.
[pytest]
pythonpath = .
testpaths = scripts
